name: auto check

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'imgs/**'
  schedule:
    - cron: '0 4,10 * * *'

jobs:
  build:
    name: glados/railgun checkin
    # 明确使用新版环境；ubuntu-latest 将于 2026-10-19 起指向 Ubuntu 26
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: write

    strategy:
      matrix:
        python-version: [3.13]

    # 强制第三方 actions 兼容 Node.js 24（Ubuntu 26 镜像默认要求）
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Ubuntu 26 可能默认没有系统 python pip，改用 venv 安装依赖
      PIP_BREAK_SYSTEM_PACKAGES: "1"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    # 安装 python 库（在虚拟环境中，避免 PEP 668 限制）
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m venv .venv
        . .venv/bin/activate
        pip install --upgrade pip
        pip install requests pypushdeer
        echo "VIRTUAL_ENV=.venv" >> $GITHUB_ENV
        echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

    # 执行签到脚本
    - name: Running checkin
      run: |
        python checkin.py
      env:
        PUSHDEER_SENDKEY: ${{ secrets.PUSHDEER_SENDKEY }}
        GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
        GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN }}
        GLADOS_VERBOSE: ${{ secrets.GLADOS_VERBOSE }}

    - name: Keep alive
      uses: liskin/gh-workflow-keepalive@v1

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 7
        keep_minimum_runs: 7
        delete_run_by_conclusion_pattern: success
